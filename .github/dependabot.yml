# GitHub Actions versions only, monthly, in one PR. npm and Cargo get security updates only
# (repository setting): their pins are upgraded by hand in dedicated PRs (CLAUDE.md, D-097).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Generated by cargo-dist, which fails `dist plan` if the file is edited; `dist generate` updates it.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
