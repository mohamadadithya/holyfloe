# Builds @holyfloe/core for every napi target (packages/core/package.json `napi.targets`) and
# assembles the per-platform npm packages. Publishing is manual for now (D-045): the `npm`
# artifact holds packages/core with its npm/<target> directories filled in.
name: napi

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, host: macos-latest }
          - { target: x86_64-apple-darwin, host: macos-latest }
          # --use-napi-cross: glibc 2.17 floor, not the runner's (2.39 would fail on Debian 12).
          - { target: x86_64-unknown-linux-gnu, host: ubuntu-latest, flags: --use-napi-cross }
          - { target: aarch64-unknown-linux-gnu, host: ubuntu-latest, flags: --use-napi-cross }
          - { target: x86_64-unknown-linux-musl, host: ubuntu-latest, flags: --cross-compile, zig: true }
          - { target: aarch64-unknown-linux-musl, host: ubuntu-latest, flags: --cross-compile, zig: true }
          - { target: x86_64-pc-windows-msvc, host: windows-latest }
          - { target: aarch64-pc-windows-msvc, host: windows-latest }
          - { target: wasm32-wasip1-threads, host: ubuntu-latest, flags: --no-default-features --features lit }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The toolchain comes from rust-toolchain.toml; rustup >= 1.28 does not auto-install it.
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile --filter @holyfloe/core
      - run: pnpm -C packages/core build --release --target ${{ matrix.target }} ${{ matrix.flags }}
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            packages/core/*.node
            packages/core/*.wasm
            packages/core/*.wasi*
            packages/core/wasi-worker*.mjs
          if-no-files-found: error

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @holyfloe/core
      - uses: actions/download-artifact@v8
        with:
          path: packages/core/artifacts
      - working-directory: packages/core
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir artifacts
          # npm packs LICENSE* files automatically; Apache-2.0 asks for a copy in each package.
          for dir in npm/*/; do cp LICENSE-MIT LICENSE-APACHE "$dir"; done
          ls -R npm
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: |
            packages/core/npm
            packages/core/index.js
            packages/core/index.d.ts
            packages/core/cem-plugin.mjs
            packages/core/package.json
            packages/core/README.md
            packages/core/LICENSE-*

  # On a version tag: stage every package on npm through trusted publishing (OIDC, no token).
  # Nothing goes live until a maintainer approves it with 2FA (npmjs.com, Staged Packages):
  # approve the platform packages first, then @holyfloe/core, then @holyfloe/unplugin.
  publish:
    needs: npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # `npm stage` needs npm >= 11.15.
      - run: npm install -g npm@11.19.0
      - run: pnpm install --frozen-lockfile --filter @holyfloe/core --filter @holyfloe/unplugin
      - name: Tag matches the package version
        run: test "v$(node -p "require('./packages/core/package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: release
      - name: Stage the platform packages
        run: for dir in release/npm/*/; do (cd "$dir" && npm stage publish --access public); done
      - name: Stage @holyfloe/core and @holyfloe/unplugin
        run: |
          cp -R release/npm packages/core/npm
          # Adds the platform packages as optionalDependencies, without publishing them again.
          pnpm -C packages/core exec napi pre-publish -t npm --skip-optional-publish
          # pnpm pack rewrites unplugin's `workspace:*` dependency to the real version.
          for pkg in core unplugin; do
            pnpm -C "packages/$pkg" pack --pack-destination "$RUNNER_TEMP"
            npm stage publish "$RUNNER_TEMP"/holyfloe-$pkg-*.tgz --access public
          done
