name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain from rust-toolchain.toml (1.97.1 + clippy, rustfmt).
      # rustup >= 1.28 no longer auto-installs on `rustup show`.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.59.0
      - run: pnpm install --frozen-lockfile
      # --with-deps installs Chromium's system libraries on Linux.
      - run: pnpm -C e2e exec playwright install --with-deps chromium
      - run: just verify
