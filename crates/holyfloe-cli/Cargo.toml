[package]
name = "holyfloe-cli"
description = "holyfloe command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
holyfloe-cem.workspace = true
holyfloe-emit-react.workspace = true
holyfloe-emit-svelte.workspace = true
holyfloe-emit-vue.workspace = true
holyfloe-fs.workspace = true
holyfloe-ir.workspace = true
holyfloe-lit = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
serde_json.workspace = true

[features]
default = ["watch", "lit"]
watch = ["dep:notify", "dep:notify-debouncer-full"]
lit = ["dep:holyfloe-lit"]

[[bin]]
name = "holyfloe"
path = "src/main.rs"
# The binary needs `--watch`; the napi crate uses only the library (wasm builds without it).
required-features = ["watch"]

[package.metadata.dist]
# The workspace is `publish = false`; this crate is the one binary cargo-dist ships (D-044).
dist = true
